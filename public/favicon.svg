<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>

    <!-- Vertical Stem Gradient -->
    <linearGradient id="stemGrad" x1="10" y1="8" x2="20" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f3e8ff" />
      <stop offset="100%" stop-color="#d8b4fe" />
    </linearGradient>

    <!-- Kinetic Base Wing Gradient -->
    <linearGradient id="wingGrad" x1="12" y1="26" x2="38" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Upward Ray Gradient -->
    <linearGradient id="rayGrad" x1="22" y1="10" x2="38" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Background Tile -->
  <rect width="48" height="48" rx="14" fill="url(#bgGrad)" />
  <rect x="0.5" y="0.5" width="47" height="47" rx="13.5" stroke="rgba(255,255,255,0.25)" />

  <!-- The LIFT Monogram Elements -->
  <!-- 1. Vertical Architectural Stem -->
  <path
    d="M12 10C12 8.89543 12.8954 8 14 8H18.5C19.6046 8 20.5 8.89543 20.5 10V28C20.5 29.1046 19.6046 30 18.5 30H14C12.8954 30 12 29.1046 12 28V10Z"
    fill="url(#stemGrad)"
  />

  <!-- 2. Kinetic Forward Base Wing -->
  <path
    d="M12 28C12 26.8954 12.8954 26 14 26H33C34.9 26 36.1 27.8 35.5 29.6L34.1 33.6C33.7 34.8 32.6 35.6 31.4 35.6H14C12.8954 35.6 12 34.7046 12 33.6V28Z"
    fill="url(#wingGrad)"
  />

  <!-- 3. Upward Elevation Apex / Arrow Facet -->
  <path
    d="M24 20L31.2 10.4C32 9.3 33.6 9.3 34.4 10.4L37.8 14.8C38.6 15.8 38 17.2 36.7 17.2H25.8C24.5 17.2 23.5 18.5 24 20Z"
    fill="url(#rayGrad)"
  />
</svg>
